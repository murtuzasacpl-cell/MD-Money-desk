<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD Money Desk</title>
<meta name="theme-color" content="#0d6b73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MD Money Desk">
<style id="css">
/* Layout: sticky top bar with tabs; summary tiles, then attention list + schedule, then ledgers. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#15212b; --muted:#5d6b76; --line:#dde3e7;
  --accent:#0d6b73; --accent-soft:#e1f0f1;
  --good:#1f7a45; --good-soft:#e2f3e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --out:#6a5acd;
  --display:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --surface:#172027; --ink:#e6edf1; --muted:#97a6b1; --line:#2a3741;
    --accent:#4fb8c0; --accent-soft:#16343a;
    --good:#5cc58a; --good-soft:#163024; --warn:#e3b04f; --warn-soft:#352a12; --bad:#f2827a; --bad-soft:#3a1c1a;
    --out:#a99cf5; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --ink:#e6edf1; --muted:#97a6b1; --line:#2a3741;
  --accent:#4fb8c0; --accent-soft:#16343a;
  --good:#5cc58a; --good-soft:#163024; --warn:#e3b04f; --warn-soft:#352a12; --bad:#f2827a; --bad-soft:#3a1c1a;
  --out:#a99cf5; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.logo svg{width:18px;height:18px;flex:none}
.ver{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.hello{display:flex;flex-direction:column;gap:2px;min-width:0}
.hello h1{font-size:28px;line-height:1.1}
.lic h1{font-size:30px;line-height:1.1}
.pwwrap{position:relative;display:block}
.pwwrap input{width:100%;padding-right:64px}
.pwbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:6px 8px;cursor:pointer;border-radius:6px}
.pwbtn:hover{background:var(--accent-soft)}
.hello .sub{color:var(--muted);font-size:13px}
.hello .sub b{color:var(--ink);font-weight:600}
.brand .right{align-self:center}
.brand .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:0 6px;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:20px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06292c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06292c}}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.save{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner .btn{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--display);font-size:26px;font-weight:700}
.tile .foot{font-size:13px;color:var(--muted)}
.tile.bad .val{color:var(--bad)} .tile.good .val{color:var(--good)} .tile.out .val{color:var(--out)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:17px}
.card-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;overflow-wrap:anywhere}
.row .main small{color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.good{background:var(--good)} .stripe.info{background:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--bg);color:var(--muted)}
.amt{font-weight:600;text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
.dialog{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog.wide{max-width:860px}
.dialog-h{display:flex;align-items:center;gap:10px}
.dialog-h h2{font-size:19px}
.dialog-h .x{margin-left:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--ink);min-width:0}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-family:var(--display);font-size:18px}
.inline-amt{width:110px;text-align:right;padding:4px 6px}
.err{color:var(--bad);font-size:13px}
.lic{max-width:520px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.lic .card{gap:14px}
.devcode{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:.08em;background:var(--bg);border-radius:10px;padding:12px;text-align:center;user-select:all}
.lic input{width:100%;font-family:ui-monospace,Menlo,monospace}
.btn.wa{background:#1f7a45;border-color:#1f7a45;color:#fff;text-decoration:none;display:inline-block;text-align:center}
.licpill{cursor:pointer;border:0}
tr.closed td{opacity:.72}
tr.sect td{background:var(--bg);font-weight:600;color:var(--muted);font-size:13px;opacity:1}
.reccode{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.06em;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px;text-align:center;user-select:all}
.cols{font-size:13px;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.cols dt{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.cols dd{margin:0;color:var(--muted)}
.paste{min-height:110px}
.stack{display:flex;flex-direction:column;gap:12px}
.rp-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.rp-controls label{min-width:150px}
.rp-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rp-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.rp-biz{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.15;margin:4px 0 2px}
.rp h3{font-size:15px;margin:6px 0 0}
.rp tfoot td{font-weight:700;border-top:2px solid var(--line)}
.rp-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rp-kv div{background:var(--bg);border-radius:10px;padding:10px 12px}
.rp-kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.rp-kv b{font-size:17px}
#print-root{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#000!important}
  #app,#modal-root{display:none!important}
  #print-root{display:block;font:11pt/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#000}
  #print-root .pbrand{display:flex;align-items:center;gap:5pt;font-size:8pt;color:#555;font-weight:600;margin-bottom:6pt}
  #print-root .pbrand svg{width:11pt;height:11pt}
  #print-root .pbiz{font-size:24pt;font-weight:800;line-height:1.1;margin:0 0 4pt}
  #print-root h1{font-size:14pt;margin:0 0 2pt}
  #print-root .nobiz h1{font-size:18pt}
  #print-root .sub{color:#444;margin:0 0 10pt}
  #print-root h3{font-size:12pt;margin:12pt 0 4pt}
  #print-root table{width:100%;border-collapse:collapse;font-size:9.5pt;page-break-inside:auto}
  #print-root tr{page-break-inside:avoid}
  #print-root th{text-align:left;border-bottom:1.5pt solid #000;padding:4pt;font-size:8.5pt;text-transform:uppercase}
  #print-root td{border-bottom:.5pt solid #bbb;padding:4pt}
  #print-root .r{text-align:right}
  #print-root tfoot td{font-weight:700;border-top:1.5pt solid #000;border-bottom:0}
  #print-root .kvp{display:flex;flex-wrap:wrap;gap:6pt 18pt;margin:6pt 0}
  #print-root .kvp div{min-width:120pt}
  #print-root .kvp span{display:block;font-size:8.5pt;color:#444}
  #print-root .foot{margin-top:14pt;font-size:8.5pt;color:#555}
}
@media (prefers-reduced-motion: no-preference){.dialog{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="print-root"></div>
<script type="application/json" id="state">null</script>
<script src="config.js"></script>
<script id="code">
(function(){
"use strict";
var TITLE = "MD Money Desk";
var _unused = '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">';

/* ---------- dates ---------- */
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
function pad(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function mkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function parseD(s){var p=s.split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
function addMonths(key,n){var p=key.split("-");var d=new Date(+p[0],+p[1]-1+n,1);return mkey(d)}
function monthsBetween(a,b){var x=a.split("-"),y=b.split("-");return (+y[0]-x[0])*12+(+y[1]-x[1])}
function dueDate(key,day){var p=key.split("-");var last=new Date(+p[0],+p[1],0).getDate();return new Date(+p[0],+p[1]-1,Math.min(day||1,last))}
function daysDiff(a,b){return Math.round((a-b)/86400000)}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function mLabel(key){var p=key.split("-");return MON[+p[1]-1]+" "+p[0]}
function dLabel(d){return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
var THIS_MONTH = mkey(TODAY);

/* ---------- state ---------- */
var state = null;
try{ state = JSON.parse(document.getElementById("state").textContent); }catch(e){ state = null; }
if(!state){ try{ var ls = localStorage.getItem("money-desk-state"); if(ls) state = JSON.parse(ls); }catch(e){} }
if(!state) state = {currency:"KES",sample:false,accounts:[],payments:[]};
var uid = function(){return Math.random().toString(36).slice(2,10)};

function seed(){
  var a = [
    {id:"c1",kind:"client",name:"Apex Logistics",party:"Grace Wanjiku",amount:80000,dueDay:5,start:"2026-06",end:"",overrides:{},notes:"Monthly retainer"},
    {id:"c2",kind:"client",name:"Mwangi & Co",party:"Peter Mwangi",amount:45000,dueDay:10,start:"2026-07",end:"",overrides:{"2026-09":60000,"2026-10":52000},notes:"Amount changes with workload. Usually pays every 2 months."},
    {id:"c3",kind:"client",name:"Bluewave Media",party:"Accounts desk",amount:30000,dueDay:1,start:"2026-08",end:"",overrides:{},notes:""},
    {id:"c4",kind:"client",name:"Savanna Retail",party:"Halima Noor",amount:120000,dueDay:15,start:"2026-09",end:"",overrides:{},notes:""},
    {id:"p1",kind:"property",dir:"in",name:"Kilimani Apt 2B",party:"Tenant: J. Otieno",amount:55000,dueDay:5,start:"2026-01",end:"2027-01",deposit:110000,notes:""},
    {id:"p2",kind:"property",dir:"in",name:"Westlands Shop 14",party:"Tenant: Duka Fresh Ltd",amount:90000,dueDay:1,start:"2025-07",end:"2028-06",deposit:180000,notes:""},
    {id:"p3",kind:"property",dir:"out",name:"Ruaka Office",party:"Landlord: K. Kamau",amount:40000,dueDay:3,start:"2026-03",end:"2027-02",deposit:80000,notes:"Lease I pay"},
    {id:"l1",kind:"loan",name:"Business loan",party:"Equity Bank",principal:1500000,rate:14,tenure:36,start:"2026-02",dueDay:20,emi:0,notes:""},
    {id:"l2",kind:"loan",name:"Car loan",party:"NCBA",principal:900000,rate:12,tenure:48,start:"2025-11",dueDay:25,emi:0,notes:""}
  ];
  var pay=[];
  function P(acc,date,amt,note){pay.push({id:"s"+pay.length,acc:acc,date:date,amount:amt,note:note||""})}
  ["2026-06-04","2026-07-05","2026-08-05","2026-09-04","2026-10-06","2026-11-05"].forEach(function(d){P("c1",d,80000)});
  P("c2","2026-08-28",90000,"Jul + Aug together"); P("c2","2026-10-30",60000,"Part of Sep");
  P("c3","2026-08-03",30000);
  P("c4","2026-09-16",120000); P("c4","2026-10-25",70000,"Balance promised in Nov");
  ["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11"].forEach(function(m){P("p1",m+"-04",55000)});
  for(var i=0;i<16;i++){var k=addMonths("2025-07",i);P("p2",k+"-02",90000)}
  ["2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11"].forEach(function(m){P("p3",m+"-02",40000)});
  var e1=emiOf(a[7]),e2=emiOf(a[8]);
  for(i=0;i<9;i++){P("l1",addMonths("2026-02",i)+"-19",e1)}
  for(i=0;i<11;i++){P("l2",addMonths("2025-11",i)+"-24",e2)}
  return {currency:"KES",sample:true,accounts:a,payments:pay};
}

/* ---------- money ---------- */
function fmt(n){
  n=Math.round(n||0);
  try{return new Intl.NumberFormat(undefined,{style:"currency",currency:state.currency||"KES",maximumFractionDigits:0}).format(n)}
  catch(e){return (state.currency||"")+" "+n.toLocaleString()}
}
function emiOf(l){
  if(+l.emi>0) return +l.emi;
  var P=+l.principal||0,n=+l.tenure||1,r=(+l.rate||0)/1200;
  if(!r) return P/n;
  return Math.round(P*r/(1-Math.pow(1+r,-n)));
}
function isIn(a){return a.kind==="client"||(a.kind==="property"&&a.dir==="in")}

/* ---------- analysis ---------- */
function duesOf(a){
  var list=[], start=a.start||THIS_MONTH, last;
  if(a.kind==="loan"){ last=addMonths(start,(+a.tenure||1)-1); }
  else { last = a.end && a.end<addMonths(THIS_MONTH,1) ? a.end : addMonths(THIS_MONTH,1); }
  if(a.closed && a.closed<last) last=a.closed;
  var n=monthsBetween(start,last);
  for(var i=0;i<=n;i++){
    var k=addMonths(start,i);
    var amt = a.kind==="loan" ? emiOf(a) : (a.overrides && a.overrides[k]!=null ? +a.overrides[k] : +a.amount);
    if(amt>0) list.push({key:k,date:dueDate(k,+a.dueDay),amount:amt,paid:0});
  }
  return list;
}
function analyze(a){
  var dues=duesOf(a);
  var pays=state.payments.filter(function(p){return p.acc===a.id}).sort(function(x,y){return x.date<y.date?-1:1});
  var total=pays.reduce(function(s,p){return s+(+p.amount)},0), pool=total;
  dues.forEach(function(d){var take=Math.min(pool,d.amount);d.paid=take;pool-=take});
  var credit=pool, owedNow=0, oldest=null, nextDue=null, dueThisMonth=0;
  dues.forEach(function(d){
    var rem=d.amount-d.paid;
    if(rem<=0.5){d.status="paid"}
    else if(d.date<TODAY){d.status=d.paid>0?"partial":"overdue";d.late=daysDiff(TODAY,d.date);owedNow+=rem;if(!oldest)oldest=d}
    else {d.status=d.paid>0?"partial-upcoming":"upcoming";if(!nextDue)nextDue=d}
    if(d.key===THIS_MONTH) dueThisMonth+=rem;
  });
  var billed=dues.filter(function(d){return d.date<=TODAY}).reduce(function(s,d){return s+d.amount},0);
  var r={a:a,dues:dues,pays:pays,paidTotal:total,credit:credit,owedNow:owedNow,oldest:oldest,nextDue:nextDue,billed:billed,dueThisMonth:dueThisMonth};
  if(a.kind==="loan"){
    var emi=emiOf(a), k=Math.min(Math.floor((total+0.5)/emi),+a.tenure), P=+a.principal, rr=(+a.rate||0)/1200;
    var bal = rr? P*Math.pow(1+rr,k)-emi*(Math.pow(1+rr,k)-1)/rr : P-emi*k;

function chartCard(){
  var months=[];for(var i=5;i>=0;i--)months.push(addMonths(THIS_MONTH,-i));
  var inV=months.map(function(){return 0}),outV=months.map(function(){return 0});

  var max=Math.max.apply(null,inV.concat(outV,[1]));

var SEC=null, UNLOCKED=false, lastAct=Date.now();
try{SEC=JSON.parse(localStorage.getItem("md-money-sec")||"null")}catch(e){SEC=null}
/* stay logged in across refresh and reopen, until Log out or the idle time passes */
var lastSaveAct=0;
function startSession(){lastAct=Date.now();lastSaveAct=lastAct;try{localStorage.setItem("md-money-session",JSON.stringify({s:SEC&&SEC.salt,t:lastAct}))}catch(e){}}
function endSession(){try{localStorage.removeItem("md-money-session")}catch(e){}}
(function(){try{var ss=JSON.parse(localStorage.getItem("md-money-session")||"null");
  if(SEC&&ss&&ss.s===SEC.salt&&(!(SEC.mins>0)||Date.now()-ss.t<SEC.mins*60000)){UNLOCKED=true;startSession()}}catch(e){}})();
function storeSec(){try{if(SEC)localStorage.setItem("md-money-sec",JSON.stringify(SEC));else localStorage.removeItem("md-money-sec")}catch(e){}}
function b64(buf){var s="";new Uint8Array(buf).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function rnd(n){var r=new Uint8Array(n);crypto.getRandomValues(r);return r}
function pbk(pass,salt,iter){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"])
    .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:Uint8Array.from(atob(salt),function(c){return c.charCodeAt(0)}),iterations:iter},k,256)}).then(b64);
}
function normRec(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function newSec(pass){
  var rec="";var r=rnd(12);for(var i=0;i<12;i++){rec+=ALPH[r[i]%ALPH.length];if(i===3||i===7)rec+="-"}
  var ns={iter:150000,salt:b64(rnd(16)),rsalt:b64(rnd(16)),mins:SEC&&SEC.mins!=null?SEC.mins:60,user:SEC&&SEC.user||""};
  return pbk(pass,ns.salt,ns.iter).then(function(h){ns.hash=h;return pbk(normRec(rec),ns.rsalt,ns.iter)}).then(function(h){ns.rhash=h;SEC=ns;storeSec();return rec});
}
function checkPass(p){return SEC?pbk(p,SEC.salt,SEC.iter).then(function(h){return h===SEC.hash}):Promise.resolve(true)}
function showRecovery(rec){
  modal('<div class="dialog-h"><h2>Save your recovery code</h2></div>'+
    '<p style="margin:0">If you forget your password, this code lets you set a new one. Write it down or save it somewhere private. It is shown only now.</p>'+
    (SEC&&SEC.user?'<p style="margin:0">Your username: <b>'+esc(SEC.user)+'</b></p>':'')+
    '<div class="reccode">'+rec+'</div>'+
    '<div class="actions"><button class="btn" data-act="copy-rec" data-code="'+rec+'">Copy</button><button class="btn primary" data-act="rec-done">I have saved it</button></div>');

function parseTable(text){

  var rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){

var MONS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};

function pDate(v){
  v=String(v||"").trim();if(!v)return null;var m,y,mo,da;
  if(/^\d{5}$/.test(v)){var d=new Date(1899,11,30);d.setDate(d.getDate()+(+v));return ymd(d)}
  if((m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+m[1];mo=+m[2];da=+m[3]}
  else if((m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){da=+m[1];mo=+m[2];y=+m[3];if(mo>12&&da<=12){var t=da;da=mo;mo=t}}
  else if((m=v.match(/^(\d{1,2})[\s\-]+([A-Za-z]{3})[a-z]*\.?[\s\-,]+(\d{2,4})$/))){da=+m[1];mo=MONS[m[2].toLowerCase()];y=+m[3]}
  else if((m=v.match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{2,4})$/))){mo=MONS[m[1].toLowerCase()];da=+m[2];y=+m[3]}

var REP={kind:"monthly",month:THIS_MONTH,from:ymd(TODAY),to:ymd(TODAY),acc:"",sfrom:"",sto:ymd(TODAY),loan:"all"};
function lastDayOf(key){var p=key.split("-");return ymd(new Date(+p[0],+p[1],0))}
function paysOf(a){return state.payments.filter(function(p){return p.acc===a.id})}
function sumAmt(arr){return arr.reduce(function(s,x){return s+(+x.amount)},0)}
function balanceAsOf(a,endStr){
  var end=parseD(endStr);
  var due=sumAmt(duesOf(a).filter(function(d){return d.date<=end}));
  var paid=sumAmt(paysOf(a).filter(function(p){return p.date<=endStr}));
  return due-paid;
}
function partyType(a){return a.kind==="client"?"Client":a.kind==="loan"?"Loan":(a.dir==="in"?"Tenant":"Lease I pay")}
function amortize(a){
  var r=analyze(a),emi=r.emi,bal=+a.principal,rr=(+a.rate||0)/1200,rows=[];
  r.dues.forEach(function(d,i){
    var interest=rr?bal*rr:0, princ=Math.min(bal,emi-interest);
    if(i===r.dues.length-1&&!a.closed)princ=bal;
    bal=Math.max(0,bal-princ);
    rows.push({n:i+1,d:d,interest:interest,princ:princ,bal:bal});
  });
  return {r:r,rows:rows};
}

  var title="Loan schedule: "+L.name;
  return {title:title,sub:(L.party||"")+" · "+fmt(L.principal)+" at "+(+L.rate||0)+"% for "+L.tenure+" months · "+gen,file:"MD Money Desk - "+title,blocks:[
    {type:"kv",rows:[["Instalment",am.r.emi,1],["Paid so far",am.r.paidTotal,1],["Instalments paid",am.r.paidCount+" of "+L.tenure,0],["Balance left",am.r.balance,1],["Missed now",am.r.owedNow,1],["Total interest",Math.round(ti),1]]},
    {type:"table",heading:"Repayment schedule",cols:[{h:"No."},{h:"Month"},{h:"Due date"},{h:"Instalment",m:1},{h:"Interest",m:1},{h:"Principal",m:1},{h:"Balance after",m:1},{h:"Status"}],rows:srows,total:["","Total","",sumAmt(am.rows.map(function(x){return {amount:x.d.amount}})),Math.round(ti),Math.round(tpr),"",""]}]};
}

var CRC_T=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipStore(files){

  files.forEach(function(f){

    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    var c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);
    c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);

  });

  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(central,[new Uint8Array(e.buffer)]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xe(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"")}
function colName(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function makeXlsx(R){

  var rows=[],widths=[];

  add([{v:"MD Money Desk",s:5}]);if(bizName())add([{v:bizName(),s:6}]);
  add([{v:R.title,s:4}]);add([{v:R.sub+" · Amounts in "+state.currency,s:5}]);add([]);

    if(b.type==="kv"){b.rows.forEach(function(r){add([{v:r[0],s:1},{v:r[1],s:r[2]?2:0,n:typeof r[1]==="number"}]);w(0,r[0]);w(1,r[2]?fmt(r[1]):r[1])});add([]);return}
    add([{v:b.heading,s:1}]);

    b.rows.forEach(function(r){add(r.map(function(v,i){var m=b.cols[i].m;w(i,m&&v!=null?fmt(v):v);return v==null||v===""?null:{v:m?Math.round(v*100)/100:v,s:m?2:0,n:typeof v==="number"}}))});

  var sd=rows.map(function(r,ri){

      return c.n?'<c r="'+ref+'" s="'+(c.s||0)+'"><v>'+c.v+'</v></c>':'<c r="'+ref+'" s="'+(c.s||0)+'" t="inlineStr"><is><t xml:space="preserve">'+xe(c.v)+'</t></is></c>'}).join("");
    var big=r[0]&&r[0].s===6;
    return '<row r="'+(ri+1)+'"'+(big?' ht="30" customHeight="1"':'')+'>'+cs+'</row>'}).join("");
  var cols=widths.map(function(x,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(x||10)+'" customWidth="1"/>'}).join("");
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews>'+(cols?'<cols>'+cols+'</cols>':'')+'<sheetData>'+sd+'</sheetData><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>';
  var styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="15"/><name val="Calibri"/></font><font><sz val="10"/><color rgb="FF666666"/><name val="Calibri"/></font><font><b/><sz val="22"/><name val="Calibri"/></font></fonts>'+
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
    '<xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>'+
    '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  var sname=R.title.replace(/[\[\]\:\*\?\/\\]/g," ").slice(0,31);
  return zipStore([
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},

function downloadBlob(name,blob){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name.replace(/[\\\/:*?"<>|]/g," ");document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500)}

/* ---------- show / hide password ---------- */
function enhancePw(root){
  (root||document).querySelectorAll('input[type="password"]:not([data-pw])').forEach(function(inp){
    inp.setAttribute("data-pw","1");
    var w=document.createElement("span");w.className="pwwrap";inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    var b=document.createElement("button");b.type="button";b.className="pwbtn";b.textContent="Show";b.setAttribute("aria-label","Show password");
    b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();var show=inp.type==="password";inp.type=show?"text":"password";b.textContent=show?"Hide":"Show";b.setAttribute("aria-label",show?"Hide password":"Show password");inp.focus()});
    w.appendChild(b);
  });
}
try{new MutationObserver(function(){enhancePw()}).observe(document.body,{childList:true,subtree:true})}catch(e){}

/* ---------- licence ---------- */
var PRODUCT="md-money", CFG=window.MD_CONFIG||null;
var LIC={dev:"",key:"",status:"none",type:"",end:"",left:null};
var ALPH="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function getDevice(){
  var d=lsGet("md-money-device");
  if(!d||!/^[A-Z0-9]{5}-[A-Z0-9]{5}$/.test(d)){
    var r=new Uint8Array(10);crypto.getRandomValues(r);d="";
    for(var i=0;i<10;i++){d+=ALPH[r[i]%ALPH.length];if(i===4)d+="-"}
    lsSet("md-money-device",d);
  }
  return d;
}
function todayNum(){
  // never let the clock go backwards: use the latest date this device has seen
  var t=+ymd(new Date()).replace(/-/g,""), seen=+(lsGet("md-money-seen")||0);
  if(t>seen){lsSet("md-money-seen",String(t));return t}
  return seen;
}
function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function checkKey(key){
  key=(key||"").replace(/\s+/g,"");
  var m=key.match(/^(T\d{8}|L\d{8}|F)\.([A-Za-z0-9_-]+)$/);
  if(!m) return Promise.resolve({ok:false,why:"format"});
  if(!CFG||!CFG.publicKey) return Promise.resolve({ok:false,why:"setup"});
  var pre=m[1],sig;
  try{sig=b64u(m[2])}catch(e){return Promise.resolve({ok:false,why:"format"})}
  return crypto.subtle.importKey("jwk",CFG.publicKey,{name:"ECDSA",namedCurve:"P-256"},false,["verify"])
    .then(function(k){return crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,sig,new TextEncoder().encode(PRODUCT+"|"+LIC.dev+"|"+pre))})
    .then(function(good){
      if(!good) return {ok:false,why:"device"};
      var type=pre[0], end=pre.slice(1), left=null;
      if(end){
        var e=new Date(+end.slice(0,4),+end.slice(4,6)-1,+end.slice(6,8)), t=String(todayNum()), td=new Date(+t.slice(0,4),+t.slice(4,6)-1,+t.slice(6,8));
        left=Math.round((e-td)/86400000)+1;
        if(left<=0) return {ok:false,why:"ended",type:type,end:end};
      }
      return {ok:true,type:type,end:end,left:left};
    }).catch(function(){return {ok:false,why:"format"}});
}
function showEnd(e){return e.slice(6,8)+"/"+e.slice(4,6)+"/"+e.slice(0,4)}
function licPill(){
  if(LIC.status!=="ok") return "";
  var txt,cls="plain";
  if(LIC.type==="F"){txt="Licensed"}
  else{txt=(LIC.type==="T"?"Trial":"Licence")+" · "+LIC.left+(LIC.left===1?" day":" days")+" left";if(LIC.left<=7)cls="warn"}
  return '<button class="pill '+cls+' licpill" data-act="lic-open">'+txt+'</button>';
}
function waLink(text){var ph=CFG&&CFG.sellerPhone?String(CFG.sellerPhone).replace(/\D/g,""):"";return "https://wa.me/"+ph+"?text="+encodeURIComponent(text)}
function licBody(msg){
  var seller=(CFG&&CFG.sellerName)||"the seller";
  return '<p style="margin:0">Send this device code to '+esc(seller)+'. You will get a licence key back.</p>'+
    '<div class="devcode num">'+LIC.dev+'</div>'+
    '<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="lic-copy">Copy code</button>'+
    '<a class="btn wa" href="'+waLink("Hello, I would like a licence key for MD Money Desk (v"+APP_VERSION+"). My device code is "+LIC.dev)+'" target="_blank" rel="noopener">Send on WhatsApp</a></div>'+
    (CFG&&CFG.sellerPhone?'<p class="hint" style="margin:-6px 0 0">WhatsApp: +'+esc(String(CFG.sellerPhone).replace(/\D/g,""))+'</p>':'')+
    '<label for="lic-key">Licence key<input id="lic-key" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Paste the key here"></label>'+
    '<p class="err" id="lic-err">'+(msg||"")+'</p>'+
    '<div class="actions"><button class="btn primary" data-act="lic-activate">Activate</button></div>';
}
function whyText(r){
  if(r.why==="setup") return "This copy of MD Money Desk is not set up yet (config.js is missing). Contact the seller.";
  if(r.why==="ended") return "This licence ended on "+showEnd(r.end)+". Ask for a renewal key and paste it here. Your data is safe.";
  if(r.why==="device") return "This key is not for this device. Check that you sent the device code shown above.";
  return "That doesn't look like a complete licence key. Copy the whole key and paste it again.";
}
function renderLicence(msg){
  var hasData=state&&state.accounts&&state.accounts.length&&!state.sample;
  document.getElementById("app").innerHTML='<div class="lic"><span class="logo">'+LOGO+'MD Money Desk <span class="ver">v'+APP_VERSION+'</span></span><h1>'+esc(bizName()||"MD Money Desk")+'</h1><section class="card">'+
    '<h2 style="font-size:17px">'+(LIC.status==="ended"?"Your licence has ended":"Activate MD Money Desk")+'</h2>'+licBody(msg)+'</section>'+
    (hasData?'<p class="muted" style="font-size:13px;margin:0">Your records are still on this device. <button class="btn link" data-act="download-bk">Download a backup of my data</button></p>':'')+'</div>';
}
function licenceDialog(){
  var st=LIC.type==="F"?"Full licence. It never ends.":(LIC.type==="T"?"Trial":"Paid licence")+" until "+showEnd(LIC.end)+" ("+LIC.left+" days left).";
  modal('<div class="dialog-h"><h2>Licence</h2><button class="btn sm x" data-act="close">Close</button></div><p style="margin:0"><b>'+st+'</b></p><p class="muted" style="margin:0">To renew or upgrade, send the device code and paste the new key here.</p>'+licBody(""));
}
function activate(key){
  var err=document.getElementById("lic-err");if(err)err.textContent="Checking…";
  checkKey(key).then(function(r){
    if(!r.ok){if(err)err.textContent=whyText(r);return}
    lsSet("md-money-licence",key.replace(/\s+/g,""));
    LIC.key=key;LIC.status="ok";LIC.type=r.type;LIC.end=r.end;LIC.left=r.left;
    closeModal();render();
  });
}
LIC.dev=getDevice();
LIC.key=lsGet("md-money-licence")||"";
checkKey(LIC.key).then(function(r){
  if(r.ok){LIC.status="ok";LIC.type=r.type;LIC.end=r.end;LIC.left=r.left;render()}
  else{LIC.status=r.why==="ended"?"ended":"none";renderLicence(LIC.key?whyText(r):"")}
});
if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
